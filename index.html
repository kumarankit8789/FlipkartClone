<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
     <header class="header">
        <div class="top">
            <div class="logo"><div class="logoimg"></div>Flipkart</div>
            <div class="travel"><div class="logoimg"></div>Travel</div>
            <div class="grocery"><div class="logoimg"></div>Grocery</div>
            <div class="location"><div class="logoimg"></div>Vadodara,Gujrat</div>
        </div>
        <div class="middle">
            <input class="search" type="text" placeholder="Search for Products, Brands and More">
            <!-- <button>Search</button> -->
            <div class="logoi"></div>
            <span>Login</span>
            <span>More</span>
            <span>Cart</span>
        </div>
        <div class="bottom">
            <div class="box box1">
                <img src="bag.png" alt="">
                <div class="name">ForYou</div>
            </div>
            <div class="box box2">
                <img src="shirt.png" alt="">
                <div class="name">Fashion</div>
            </div>
            <div class="box box3">
                <img src="iphone.png" alt="">
                <div class="name">Mobiles</div>
            </div>
            <div class="box box4">
                <img src="lipstick.png" alt="">
                <div class="name">Beauty</div>
            </div>
            <div class="box box5">
                <img src="laptop-computer.png" alt="">
                <div class="name">Laptops</div>
            </div>
            <div class="box box6">
                <img src="idea.png" alt="">
                <div class="name">Lamps</div>
            </div>
            <div class="box box7">
                <img src="television.png" alt="">
                <div class="name">Tv's</div>
            </div>
            <div class="box box8">
                <img src="rocking-horse.png" alt="">
                <div class="name">Toys</div>
            </div>
            <div class="box box9">
                <img src="soft-drink.png" alt="">
                <div class="name">Drinks</div>
            </div>
            <div class="box box10">
                <img src="helmet.png" alt="">
                <div class="name">Helmets</div>
            </div>
            <div class="box box11">
                <img src="motor.png" alt="">
                <div class="name">Bikes</div>
            </div>
            <div class="box box12">
                <img src="cricket.png" alt="">
                <div class="name">Cricket</div>
            </div>
            <div class="box box13">
                <img src="open-book.png" alt="">
                <div class="name">Books</div>
            </div>
            <div class="box box14">
                <img src="sofa.png" alt="">
                <div class="name">Furniture</div>
            </div>
        </div>
     </header>
     <!-- main -->
      <section class="hero">
        <div class="image">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/a393addc6186a649.jpg?q=60" alt="image1">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/b0a8dd41775c3d0f.png?q=60" alt="image2">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/6af3b636fa80697f.png?q=60" alt="image3">
        </div>
      </section>
      <!-- Footer -->
       <section id="recommendation">
        <h2>Brands in SpotLight</h2>
        <div class="container">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/760/1020/image/6f9147c67dd8fa13.png?q=60" alt="1">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/760/1020/image/d855811fe0185c09.png?q=60" alt="2">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/760/1020/image/59127e6a4ea8b6dc.png?q=60" alt="3">
            <img src="https://rukminim2.flixcart.com/fk-p-flap/760/1020/image/aacf8529fea2cb1f.png?q=60" alt="4">
        </div>
       </section>
       <!-- foot -->
        <footer class="footer">
            <div class="description">
                <h2>Flipkart</h2>
                <p>Best Place to Buy</p>
            </div>
            <div class="about">
                <h2>About</h2>
                <p>About us</p>
                <p>Contact us</p>
                <p>Carrier</p>
                <p>Information</p>
            </div>
            <div class="help">
                <h2>Help</h2>
                <p>Orders</p>
                <p>Payment</p>
                <p>Faq</p>
            </div>
        </footer>
</body>
</html>
